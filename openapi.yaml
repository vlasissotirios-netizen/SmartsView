          - $ref: '#/components/schemas/CategoryDetails'
          - $ref: '#/components/schemas/SmartsViewNullValue'
        externalSystemIds:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/ExternalAvailabilitySystemIdDetails'
            - $ref: '#/components/schemas/ExternalSystemIdDetails'
          description: Αναγνωριστικά σε εξωτερικά συστήματα, όπου διατίθενται. Δεν είναι API credentials.
