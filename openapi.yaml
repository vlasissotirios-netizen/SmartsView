          nullable: true
        key:
          type: integer
          description: Numeric product key. Στα παραδείγματα:127 Κάστρο Λαμίας,140 Φραντζόμυλος. Δεν είναι το GUI
            «Key από μεταφορά» ούτε API authentication key.
          format: int32
        name:
          type: string
          description: Όνομα/label της οντότητας. Η γλώσσα του δεν εγγυάται ότι ακολουθεί πάντα το languageCulture.
          nullable: true
