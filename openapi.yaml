  /api/v1/metadata:
    post:
      tags:
      - Metadata
      summary: Ανάκτηση λεξικών αναφοράς
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetaDataRequest'
            examples:
              productTypes:
                summary: Τύποι προϊόντων
                description: 'JSON body για αυτή την περίπτωση χρήσης. Πλήρες αρχείο: `examples/metadata/productTypes.json`.'
                value:
                  languageCulture: el-gr
                  types:
                  - ProductType
              languages:
                summary: Διαθέσιμες γλώσσες
                description: 'JSON body για αυτή την περίπτωση χρήσης. Πλήρες αρχείο: `examples/metadata/languages.json`.'
                value:
                  languageCulture: el-gr
                  types:
                  - Language
        description: JSON body με τις επιλογές του αιτήματος. Δες τα required properties στο Schema.
      responses:
        '200':
          description: Επιτυχής απόκριση. Τα επιλεγμένα response examples είναι πλήρη αποθηκευμένα στιγμιότυπα.
          content:
            application/json:
              schema:
