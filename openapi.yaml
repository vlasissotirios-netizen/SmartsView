            με ticket.capacity.
      additionalProperties: true
      description: Μορφή ποσού με βάση τιμολόγησης και numberOfPeopleBasedUpon ως string. Διατήρησε τους πραγματικούς
        τύπους· δεν έχει επιβεβαιωθεί αριθμητική σχέση με την integer capacity ενός ticket.
    SmartsViewEventPrice:
      anyOf:
      - $ref: '#/components/schemas/SmartsViewPriceWithBasisDetails'
      - $ref: '#/components/schemas/SmartsViewPriceWithBasisAndNormalisingCapacityDetails'
      description: Εναλλακτικές παρατηρημένες μορφές ποσού εκδήλωσης. Το anyOf επιτρέπει επικάλυψη προαιρετικών
        πεδίων· όταν υπάρχει type, το enum αναγνωρίζει τη μορφή. Άλλες price μορφές δεν τεκμηριώνονται από τα διαθέσιμα
        δείγματα.
    SmartsViewEventTicketOpeningDetails:
      type: object
      properties:
        start:
          type: string
          description: Ακριβές timezone-free string αρχής. Δεν ορίζεται strict date-time.
        end:
          type: string
          description: Ακριβές timezone-free string τέλους. Ισότητα start/end δεν αποδεικνύει διάρκεια ή inclusivity.
        minGuidePrice:
          $ref: '#/components/schemas/SmartsViewEventPrice'
        maxGuidePrice:
          $ref: '#/components/schemas/SmartsViewEventPrice'
      additionalProperties: true
      description: Περίοδος ticket με ημερομηνίες και τιμές. Δεν είναι product TimeBoundOpeningDetails και δεν απαιτεί
        type/openingType/days. Τα start/end παρατηρήθηκαν ίσα χωρίς timezone· δεν ερμηνεύονται ως event occurrence.
    SmartsViewEventTicketDetails:
      type: object
      properties:
        key:
          type: integer
          description: Integer αναγνωριστικό ticket, διαφορετικό από product keys και unitType references.
        unitType:
          type: integer
          description: Integer reference τύπου μονάδας από UnitType metadata, όπου διατίθεται η αντίστοιχη εγγραφή.
        quantity:
          type: integer
          description: Ποσότητα ticket ως integer. Δεν προστίθενται μη επιβεβαιωμένα min/max.
        capacity:
          type: integer
          description: Χωρητικότητα ticket ως integer. Δεν τεκμηριώνεται από την τιμή της αριθμητική σχέση με το
            string numberOfPeopleBasedUpon.
        name:
          type: string
          description: Ονομασία ticket από το περιεχόμενο της εκδήλωσης. Ελληνική τιμή έχει εμφανιστεί και σε αγγλικό
            response· δεν τεκμηριώνεται καθολική πολιτική μετάφρασης ή fallback.
        guidePrice:
          $ref: '#/components/schemas/SmartsViewEventPrice'
        openings:
          type: array
          description: Περίοδοι ημερομηνιών και τιμών του ticket, διαφορετικές από τα product openings. Έχουν παρατηρηθεί
            null και array περιόδων σε διαφορετικά snapshots. Η παράλειψη, το null και το [] δεν εξομοιώνονται·
            κενό array δεν έχει επιβεβαιωθεί από αυτά τα ticket δείγματα.
          items:
            $ref: '#/components/schemas/SmartsViewEventTicketOpeningDetails'
          nullable: true
      additionalProperties: true
      description: Περιγραφικό στοιχείο εισιτηρίου εκδήλωσης, με ποσότητα, χωρητικότητα και τιμές όπου παρέχονται.
        Τα πεδία παραμένουν optional όπως ορίζει το schema. Η παρουσία τους δεν παρέχει λειτουργία κράτησης ή έκδοσης
        εισιτηρίου.
    SmartsViewEventPriceRangeSummary:
      type: object
      properties:
        availabilityPriceRangeSummary:
          description: Παρατηρήθηκε μόνο null. Το schema αφήνεται σκόπιμα unconstrained, συμπεριλαμβανομένου null·
            δεν ισχυρίζεται κανέναν μη-null τύπο ή availability λειτουργία.
        minGuidePrice:
          $ref: '#/components/schemas/SmartsViewEventPrice'
        maxGuidePrice:
          $ref: '#/components/schemas/SmartsViewEventPrice'
        minGuidePricePerPerson:
          $ref: '#/components/schemas/SmartsViewPriceWithBasisAndNormalisingCapacityDetails'
        maxGuidePricePerPerson:
          $ref: '#/components/schemas/SmartsViewPriceWithBasisAndNormalisingCapacityDetails'
      additionalProperties: true
      description: Παρατηρημένο Event priceRangeSummary. Δεν υπολογίζονται τιμές, κανονικοποίηση ή σχέση min/max
        από τα ονόματα.
    SmartsViewEventProduct:
      allOf:
      - $ref: '#/components/schemas/SmartsViewProduct'
      - type: object
        properties:
          productType:
            type: string
            description: Routing tag του συγκεκριμένου Event branch, όχι πλήρες product-type enum.
            enum:
            - even
          tickets:
            type: array
            description: Παρατηρημένα ticket details για Event153.
            items:
              $ref: '#/components/schemas/SmartsViewEventTicketDetails'
          priceRangeSummary:
            $ref: '#/components/schemas/SmartsViewEventPriceRangeSummary'
          generalpricingtext:
            type: string
            description: Ακριβές lowercase wire property. Παρόν ως string στο el-gr, απόν στο en-GB. Δεν μετονομάζεται
              σε generalPricingText.
        additionalProperties: true
        description: Πρόσθετη περιγραφόμενη μορφή Event response. Τα tickets, priceRangeSummary και lowercase generalpricingtext
          δεν μεταφέρονται ως typed properties σε όλα τα product types.
      description: 'Αναλυτική εκδήλωση: κοινά Product πεδία μαζί με τις παρατηρημένες προαιρετικές ενότητες tickets,
        priceRangeSummary και generalpricingtext. Η τεκμηριωμένη μορφή pricing περιορίζεται στα Event δείγματα·
        δεν συνάγεται ότι άλλα product types αποκλείεται να έχουν πρόσθετα πεδία.'
    SmartsViewProductResponseItem:
      oneOf:
      - $ref: '#/components/schemas/SmartsViewEventProduct'
      - allOf:
        - $ref: '#/components/schemas/SmartsViewProduct'
        - not:
            required:
            - productType
            properties:
              productType:
                type: string
                enum:
                - even
      description: Στοιχείο της λίστας Products. Το productType even χρησιμοποιεί το Event μοντέλο, ενώ οι άλλοι
        τύποι το κοινό Product. Οι δύο κλάδοι είναι διακριτοί ώστε οι τύποι Event pricing να ελέγχονται. Το μοντέλο
        δεν χρησιμοποιείται για relatedProducts ή Mapstubs.
    SmartsViewLocationResponse:
      type: object
      properties:
        locations:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/SmartsViewPlaceLocationOption'
            - $ref: '#/components/schemas/SmartsViewPolygonLocationOption'
            - $ref: '#/components/schemas/SmartsViewAddressLine4LocationOption'
          description: 'Επιλογές τοποθεσίας: Place/Polygon references με string key ή κειμενική AddressLine4 επιλογή
            με string value. Μπορεί να υπάρχουν επαναλαμβανόμενα type/key pairs. Δεν είναι πλήρεις διευθύνσεις προϊόντων.'
          nullable: true
      additionalProperties: false
      description: Επιλογές τοποθεσίας για τα επιλεγμένα productTypes. Περιλαμβάνει references τόπων/πολυγώνων και
        την παρατηρημένη κειμενική επιλογή AddressLine4LocationOption. Δεν εγγυάται uniqueness ή πλήρη επίλυση κάθε
        reference μέσω Metadata.
    SmartsViewFullProductResponse:
      required:
      - results
      - totalResultCount
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SmartsViewProductResponseItem'
          description: Στοιχεία της τρέχουσας απόκρισης. Για πλήθος/πληρότητα έλεγχε και τα αντίστοιχα total ή exceeded
            πεδία του endpoint.
        totalResultCount:
          type: string
          description: Συνολικό πλήθος matching προϊόντων πριν το pagination, ως JSON string, π.χ. "2". Μία κενή
            σελίδα δεν συνεπάγεται total"0".
        summaryFilters:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/PlaceSummaryFilter'
            - $ref: '#/components/schemas/PolygonSummaryFilter'
          description: Στα διαθέσιμα Products probes επιστρέφει[]. Nonempty Place/Polygon summaries και υπολογισμός
            counts δεν έχουν επαληθευτεί. Δεν προσφέρεται ως supported request input.
          nullable: true
          example: []
      additionalProperties: false
      description: Σελίδα αναλυτικών προϊόντων. Το results είναι η τρέχουσα σελίδα και το totalResultCount είναι
        string με το συνολικό πλήθος του filtered set. Τα nonempty summaries δεν έχουν επαληθευτεί.
    SmartsViewMappingResponse:
      required:
      - maxResultCountExceeded
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SmartsViewMappingStub'
          description: Συνοπτικά προϊόντα της απόκρισης. Έχει παρατηρηθεί μη κενό array μαζί με maxResultCountExceeded:true.
            Το schema επιτρέπει null, αλλά το null δεν είναι επιβεβαιωμένο αποτέλεσμα αυτών των cap tests.
          nullable: true
        maxResultCountExceeded:
          type: boolean
          description: Ένδειξη ότι το ζητούμενο όριο δεν περιλαμβάνει όλο το αποτέλεσμα. Έχει παρατηρηθεί true μαζί
            με ένα επιστρεφόμενο προϊόν για cap1. Μην θεωρείς ότι η λίστα είναι πλήρης ή υποχρεωτικά null.
      additionalProperties: false
      description: Απόκριση σημείων χάρτη. Έλεγχε το maxResultCountExceeded πριν θεωρήσεις ότι το results είναι
        πλήρες. Στο cap1 δείγμα υπήρχε array ενός στοιχείου μαζί με true.
    SmartsViewCoordinateDetails:
      required:
      - latitude
      - longitude
      type: object
      properties:
        latitude:
          type: string
          description: Γεωγραφικό πλάτος ως string ή null σύμφωνα με το Schema. Διατήρησε τον πραγματικό τύπο και
            μην κατασκευάζεις συντεταγμένη όταν δεν παρέχεται θέση.
          nullable: true
        longitude:
          type: string
          description: Γεωγραφικό μήκος ως string ή null σύμφωνα με το Schema. Διατήρησε τον πραγματικό τύπο και
            μην κατασκευάζεις συντεταγμένη όταν δεν παρέχεται θέση.
          nullable: true
      additionalProperties: false
      description: Θέση προϊόντος με string ή nullable συντεταγμένες σύμφωνα με το Schema. Διαφέρει από το αριθμητικό
        input CoordinateDetails και τα Polygon points. Object με null coordinates, location:null και omitted location
        είναι διαφορετικές μορφές.
    SmartsViewMediaDetails:
      required:
      - isDefault
      - mediaType
      - sourceFileSize
      - url
      type: object
      properties:
        url:
          type: string
          description: URL του σχετικού πόρου/συνδέσμου.
        mediaType:
          type: integer
          description: Reference τύπου πολυμέσου από MediaType metadata.
          format: int32
        sourceFileSize:
          type: integer
          description: Μέγεθος αρχικού αρχείου σύμφωνα με το αρχικό μοντέλο. Η μονάδα/καθολική παρουσία χρειάζεται
            επιβεβαίωση αν ο client βασίζεται σε αυτή.
          format: int32
        altText:
          type: string
          description: Εναλλακτικό κείμενο πολυμέσου. Μπορεί να περιλαμβάνει label αρχείου/γλώσσας όπως στα observed
            δείγματα.
          nullable: true
        comments:
          type: string
          description: Πρόσθετα σχόλια πολυμέσου όπου διατίθενται.
          nullable: true
        channelsToRestrictTo:
          type: array
          items:
            type: integer
            format: int32
          description: References καναλιών περιορισμού πολυμέσου σύμφωνα με το αρχικό μοντέλο. Η ακριβής enforcement
            πολιτική απαιτεί επιβεβαίωση.
          nullable: true
        copyright:
          type: string
          description: Πληροφορίες δικαιωμάτων/απόδοσης του μέσου, όπου παρέχονται.
          nullable: true
        isDefault:
          type: boolean
          description: Ένδειξη default πολυμέσου. Μην υποθέτεις ότι το πρώτο item είναι πάντα το default.
        sequence:
          type: integer
          description: Τιμή σειράς της οντότητας σύμφωνα με το schema. Δεν ισοδυναμεί από μόνη της με καθολική εγγύηση
            ταξινόμησης όλων των responses.
          format: int32
        categories:
          type: array
          items:
            $ref: '#/components/schemas/MediaCategoryDetails'
          description: Κατηγορίες του συγκεκριμένου πολυμέσου, ως στοιχεία MediaCategoryDetails. Διαφέρουν από τις
            κατηγορίες προϊόντος CategoryDetails· δεν πρέπει να ταυτίζονται με product category keys του CategoriesFilter
            χωρίς επιβεβαιωμένη αντιστοίχιση.
          nullable: true
        key:
          type: integer
          format: int32
          description: Αναγνωριστικό της συγκεκριμένης οντότητας. Ο JSON τύπος φαίνεται στο schema· product/lookup/location
            keys δεν έχουν πάντα τον ίδιο τύπο.
        typename:
          type: string
          description: Observed όνομα τύπου media, π.χ. image. Διαφέρει από το numeric mediaType reference.
        styles:
          allOf:
          - $ref: '#/components/schemas/SmartsViewMediaStyles'
          description: Διαθέσιμα URLs παραλλαγών εικόνας (large/medium/thumbnail/wide).
      additionalProperties: true
      description: Πολυμέσο προϊόντος με τα κοινά πεδία και προαιρετικά SmartsView στοιχεία, όπως key, typename
        και styles. Δεν εγγυώνται όλα τα media το ίδιο σύνολο πεδίων ή διαθέσιμων image styles.
    SmartsViewMediaStyles:
      type: object
      description: Διαθέσιμα URLs εκδόσεων εικόνας. Χρησιμοποίησε μόνο τα keys που πράγματι επιστρέφονται, χωρίς
        να κατασκευάζεις style URLs από υπόθεση.
      properties:
        large:
          type: string
          description: URL μεγάλης παραλλαγής εικόνας, όπου επιστρέφεται.
        medium:
          type: string
          description: URL μεσαίας παραλλαγής εικόνας, όπου επιστρέφεται.
        thumbnail:
          type: string
          description: URL μικρογραφίας, όπου επιστρέφεται.
        wide:
          type: string
          description: URL πλατιάς παραλλαγής εικόνας, όπου επιστρέφεται.
      additionalProperties: false
    SmartsViewProduct:
      required:
