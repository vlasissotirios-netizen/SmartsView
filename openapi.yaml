    SmartsViewValidationError:
      type: object
      description: Captured400 JSON error shape από δοκιμές OpeningsFilter. Το status παρατηρήθηκε ως string και
        το Mapstub instance ανέφερε /api/v1/products. Δεν αποτελεί εγγύηση της μορφής κάθε error άλλου endpoint.
      properties:
        title:
          type: string
          description: Σύντομη περιγραφή σφάλματος.
        status:
          type: string
          description: Status μέσα στο error body. Στα captured SmartsViewValidationError είναι string· ο HTTP status
            της απόκρισης είναι χωριστή πληροφορία.
        detail:
          type: string
          description: Αναλυτικό μήνυμα σφάλματος, όπως επιστρέφεται από τον server. Δεν είναι σταθερό user-facing
            κείμενο εγγυημένο για κάθε περίπτωση.
        instance:
          type: string
          description: Reference διαδρομής/περίπτωσης σφάλματος. Σε captured Mapstub400 εμφανίστηκε /api/v1/products·
            δεν έχει διευκρινιστεί αν είναι προβλεπόμενο.
      required:
      - title
      - status
      - detail
      - instance
      additionalProperties: true
    SmartsViewNullValue:
