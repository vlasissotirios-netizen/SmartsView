                  maxResultCount: 1
                  offset: 0
                  productFilters:
                  - keys:
                    - 153
                    type: SpecificProductsFilter
              activityPage:
                summary: Pagination — δεύτερη σελίδα με δραστηριότητα
                description: 'JSON body για αυτή την περίπτωση χρήσης. Πλήρες αρχείο: `examples/products/activityPage.json`.'
                value:
                  offset: 1
                  productFilters:
                  - type: SpecificProductsFilter
                    keys:
                    - 153
                    - 154
                    - 155
                  - ids:
                    - attr
                    - even
                    - acti
                    type: ProductTypesFilter
                  languageCulture: el-gr
                  maxResultCount: 2
              english:
                summary: Αγγλικό περιεχόμενο
                description: 'JSON body για αυτή την περίπτωση χρήσης. Πλήρες αρχείο: `examples/products/english.json`.'
                value:
                  languageCulture: en-GB
                  maxResultCount: 5
                  productFilters:
                  - type: SpecificProductsFilter
                    keys:
                    - 127
                    - 140
                  offset: 0
              allFacilities:
                summary: Facilities — RequireAllMatch
                description: 'JSON body για αυτή την περίπτωση χρήσης. Πλήρες αρχείο: `examples/products/allFacilities.json`.
                  Η αντίστοιχη πλήρης απόκριση περιλαμβάνεται στο αρχείο.'
                value:
                  languageCulture: el-gr
                  maxResultCount: 2
                  productFilters:
