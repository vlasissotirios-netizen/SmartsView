      description: |
        ## Purpose
        Παρέχει επιλογές τόπου και πολυγώνου για φίλτρα αναζήτησης. Για τη θέση ενός συγκεκριμένου προϊόντος χρησιμοποίησε Products ή Mapstubs.

        ## Request
        Δώσε string IDs στο `productTypes`, π.χ. `attr`, `even`, `acti`. Έχουν ελεγχθεί οι επτά μη κενοί συνδυασμοί αυτών των τύπων. Το request δεν περιλαμβάνει γλώσσα ή pagination.

        ## Response
        Το `locations` περιέχει `PlaceLocationOption`, `PolygonLocationOption` ή `AddressLine4LocationOption`. Τα δύο πρώτα έχουν string `key`, ενώ η AddressLine4 string `value` χωρίς numeric key. Τα LocationFilter place/polygon inputs είναι integers.

        ## Examples
        Το βασικό example ζητά επιλογές αξιοθέατων και παρουσιάζει πλήρη καταγεγραμμένη απόκριση με τις τρεις μορφές. Τα υπόλοιπα snapshots διατηρούνται χωριστά.

        ## Important Notes / Limitations
        Επιτρέπονται οι παρατηρημένες επαναλήψεις type/key pairs· πλήθος items δεν σημαίνει πλήθος μοναδικών τόπων. Δεν εγγυάται πλήρη αντιστοίχιση με Metadata. Η ακριβής προέλευση της AddressLine4 τιμής από CMS πεδίο και τα channel override permissions παραμένουν ανεπιβεβαίωτα. Η παράλειψη `_format=json` δεν έχει επιβεβαιωθεί εδώ.
      operationId: getLocationOptions
  /api/v1/products:
    post:
      tags:
      - Products
      summary: Αναζήτηση αναλυτικών προϊόντων
      description: |
        ## Purpose
        Αναζητά πλήρεις καρτέλες αξιοθέατων, εκδηλώσεων και δραστηριοτήτων. Επιστρέφει κοινά πεδία και όσες προαιρετικές ενότητες διαθέτει το προϊόν. Τα Event responses περιγράφουν και παρατηρημένα tickets/pricing πεδία.

        ## Request
        Το Schema απαιτεί `languageCulture`, `offset`, `maxResultCount` και `productFilters`. Χρησιμοποίησε `SpecificProductsFilter` για γνωστά keys και `ProductTypesFilter` για τύπους. Πολλαπλά type IDs λειτουργούν ως OR στα ελεγμένα δείγματα· διαφορετικά φίλτρα περιορίζουν από κοινού το αποτέλεσμα.

        Τα Facilities υποστηρίζουν παρατηρημένα Any/All, exclusions και nested AND. Μην επαναλαμβάνεις τον ίδιο τύπο φίλτρου στη λίστα· χρησιμοποίησε το `NestedFacilitiesFilter` για εσωτερική σύνθεση.

        ## Response
        Το `results` είναι η τρέχουσα σελίδα. Το string `totalResultCount` αφορά όλο το filtered σύνολο. Κενό results με θετικό total μπορεί να σημαίνει offset πέρα από το τέλος.

        Τα `relatedProducts` είναι συνοπτικές αναφορές. Τα ticket `openings` είναι περίοδοι τιμών, διαφορετικές από τα ημερήσια product `openings`.

        ## Examples
        Παρέχονται βασική καρτέλα, Event tickets, Pagination με δραστηριότητα, αγγλικό περιεχόμενο, facility φίλτρο και openings με/χωρίς match. Πλήρεις πρόσθετοι συνδυασμοί διατίθενται στα fixtures.

        ## Important Notes / Limitations
        - Το `languageCulture` δεν εγγυάται μετάφραση κάθε πεδίου ή συγκεκριμένο fallback.
        - Omitted facilities δεν αποδεικνύουν κενή membership. Στο μικτό δείγμα ορισμένα προϊόντα απουσιάζουν και από inclusion και από exclusion· το exclusion δεν είναι καθολικά το συμπλήρωμα του inclusion.
        - Σε μία ελεγχόμενη περίοδο επιβεβαιώθηκαν inclusive date-only όρια και μερική επικάλυψη. Timezone, splitting, null/omitted dates και πολλαπλές περίοδοι παραμένουν περιορισμένα.
        - Τα caps δεν καθορίζουν το μέγιστο όριο του deployment· default sorting και προτεραιότητα συνδυασμών δεν έχουν επιβεβαιωθεί πλήρως.
        - Το `summaryFilters` δεν προσφέρεται ως request input. Δεν έχουν επιβεβαιωθεί μη κενά summaries, per-person υπολογισμοί ή μη-null availability.
        - Η παράλειψη `_format=json` δεν έχει επιβεβαιωθεί εδώ. Τα booking flags είναι πληροφοριακά.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmartsViewProductRequest'
            examples:
              attractionCard:
                summary: Βασική χρήση — αξιοθέατο με ωράριο
                description: 'JSON body για αυτή την περίπτωση χρήσης. Πλήρες αρχείο: `examples/products/attractionCard.json`.'
                value:
                  languageCulture: el-gr
                  maxResultCount: 1
                  productFilters:
                  - type: SpecificProductsFilter
                    keys:
                    - 154
                  offset: 0
              eventCard:
                summary: Εκδήλωση — tickets και τιμές
                description: 'JSON body για αυτή την περίπτωση χρήσης. Πλήρες αρχείο: `examples/products/eventCard.json`.'
                value:
