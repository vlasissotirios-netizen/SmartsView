        '401':
          description: Κληρονομημένος κωδικός authentication· η συμπεριφορά missing/wrong key δεν έχει επιβεβαιωθεί
            εξαντλητικά.
        '403':
          description: Έχει καταγραφεί άρνηση πρόσβασης στο Metadata, χωρίς καθολικά επιβεβαιωμένη πολιτική key/realm/channel
            ή τεκμηριωμένο body schema για όλα τα endpoints.
        '415':
          description: Κληρονομημένος κωδικός μη αποδεκτού Content-Type. Χρησιμοποίησε application/json· το runtime
            error contract δεν έχει επιβεβαιωθεί ξεχωριστά.
        '500':
          description: Κληρονομημένη περιγραφή εσωτερικού σφάλματος. Το body και η επιχειρησιακή πολιτική υποστήριξης
            παραμένουν ανεπιβεβαίωτα.
      description: |
        ## Purpose
        Επιστρέφει λεξικά για την ερμηνεία αναγνωριστικών, όπως κατηγορίες, παροχές, κανάλια, χώρες, γλώσσες και τύπους προϊόντων.

        ## Request
        Δώσε `languageCulture` και τις επιλογές `types` του `MetaDataTypeOptions`. Υπάρχει μη κενό δείγμα για καθεμία από τις 18 επιλογές, χωρίς να έχουν ελεγχθεί όλοι οι συνδυασμοί/locales.

        ## Response
        Το `data` περιέχει διαφορετικά lookup schemas. Το response `type` επιλέγει τη μορφή και μπορεί να διαφέρει από το request label: `ProductType` → `ProducttypeLookup`, `Language` → `LanguageCultureLookup`.

        Στο Language lookup το `isDefault` είναι string, το `currency` string ή integer και το `country` integer reference.

        ## Examples
        «Τύποι προϊόντων» για βασική χρήση και «Γλώσσες» για τη μικτή μορφή των πεδίων. Τα πλήρη αρχικά fixtures, συμπεριλαμβανομένων των Polygon δεδομένων, διατηρούνται στον φάκελο examples.

        ## Important Notes / Limitations
        Οι λίστες δεν εγγυώνται επίλυση κάθε reference άλλων responses. Έχει καταγραφεί επιτυχία και χωρίς `_format`, αλλά δεν έχει καθοριστεί συμπεριφορά άλλων τιμών. Ένα 403 καταγράφει άρνηση πρόσβασης, όχι εξαντλητική auth πολιτική.
      operationId: getMetadata
      parameters:
      - name: _format
        in: query
        required: false
        description: Παρατηρημένη τιμή json. Στο Metadata έχει καταγραφεί HTTP200 JSON και χωρίς αυτή την παράμετρο.
          Άλλες τιμές δεν έχουν επιβεβαιωθεί· δεν δηλώνεται default ή enum.
        schema:
          type: string
        example: json
