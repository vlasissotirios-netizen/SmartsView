      description: |
        ## Purpose
        Παρέχει συνοπτικές καρτέλες αξιοθέατων, εκδηλώσεων και δραστηριοτήτων για προβολή σε χάρτη. Για πλήρες περιεχόμενο χρησιμοποίησε Products.

        ## Request
        Δώσε γλώσσα, ζητούμενο cap και φίλτρα σύμφωνα με το `MappingProductRequest`. Δεν περιλαμβάνει `offset` ή `sortOrders`. Στα συγκριμένα δείγματα η επιλογή τύπων, facilities και openings συμφωνεί με το Products· η response δομή είναι διαφορετική.

        ## Response
        Το `results` περιέχει τα διαθέσιμα συνοπτικά πεδία. Έλεγχε το `maxResultCountExceeded`: μπορεί να είναι true μαζί με μη κενό array. Τότε μην θεωρείς τη λίστα πλήρη. Η null μορφή που επιτρέπει το Schema δεν έχει παρατηρηθεί στα συγκεκριμένα cap tests.

        ## Examples
        Βασική καρτέλα δραστηριότητας και μικτό σύνολο με υπέρβαση cap. Τα υπόλοιπα πλήρη snapshots διατηρούνται στα fixtures.

        ## Important Notes / Limitations
        Η θέση μπορεί να περιέχει null coordinates· μην κατασκευάζεις σημείο χάρτη. Τα timestamps χωρίς offset δεν τεκμηριώνουν UTC. Η απουσία facility λίστας από stub δεν εμποδίζει το φιλτράρισμα. Ισχύουν τα ίδια όρια επιβεβαίωσης facilities/openings των συγκριμένων Products cases. Channel overrides, error policy και παράλειψη `_format=json` παραμένουν περιορισμένα ως προς την επιβεβαίωση.
      operationId: searchMapstubs
